<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 旧ハッシュURL（/#/terms 等）を静的HTMLの実URLへ寄せる。# 以降はサーバへ届かず _redirects では
         処理できないため、ここ（最速の同期スクリプト）でクライアント側リダイレクトする。 -->
    <script>
      (function () {
        var map = { '#/terms': '/terms', '#/privacy': '/privacy', '#/tokushoho': '/tokushoho' }
        var to = map[location.hash]
        if (to) location.replace(to)
      })()
    </script>
    <title>コトノハ-leaf- — 小説、書いてみよう。</title>
    <meta
      name="description"
      content="登録もインストールも不要。ブラウザで開いてすぐ書き始められる、無料の縦書き小説エディタ。縦書きプレビュー・自動保存・毎日の記録つき。はじめての一作にも。"
    />
    <meta name="theme-color" content="#2c5b27" />
    <link rel="icon" href="/favicon-clean.png" type="image/png" sizes="any" />
    <!-- 正規URLは本番ドメインに固定（プレビュー配信の重複インデックスを防ぐ）。 -->
    <link rel="canonical" href="https://cotonoha-leaf.org/" />

    <!-- 表示設定の先読み（描画前にテーマ・本文サイズを反映してちらつきを防ぐ）。
         キー/値は src/ui/hooks/use-preferences.ts と一致させること。 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ns-theme') || 'system'
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var s = localStorage.getItem('ns-reading-size')
          var px = s === 'small' ? '13.5px' : s === 'large' ? '17px' : ''
          if (px) document.documentElement.style.setProperty('--reading-font-size', px)
        } catch (e) {}
      })()
    </script>

    <!-- OGP（SNS 共有時のカード。画像は LP と共通） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="コトノハ-leaf-" />
    <meta property="og:title" content="コトノハ-leaf- — 小説、書いてみよう。" />
    <meta
      property="og:description"

    />

    <meta

    />
    <meta name="twitter:image" content="https://cotonoha-leaf.org/lp/ogp.png" />
    <link rel="alternate" type="text/markdown" href="https://cotonoha-leaf.org/llms-full.txt" title="機能と AI 連携の全体像（Markdown）" />

    <!-- 構造化データ（COT-22）。/ は SPA で本文を JS で描くため、JS を実行しないクローラーには
         ここと下の <noscript> が唯一の説明になる。詳しい版は /lp/ の JSON-LD（同じ @id で参照し合う）。 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://cotonoha-leaf.org/#website",
            "url": "https://cotonoha-leaf.org/",
            "name": "コトノハ-leaf-",
            "inLanguage": "ja"
          },
          {
            "@type": "WebApplication",
            "@id": "https://cotonoha-leaf.org/#app",
            "name": "コトノハ-leaf-",
            "url": "https://cotonoha-leaf.org/",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "縦書き小説エディタ",
            "operatingSystem": "Web",
            "inLanguage": "ja",
            "isAccessibleForFree": true,
            "description": "登録もインストールも不要。ブラウザで開いてすぐ書き始められる、無料の縦書き小説エディタ。縦書きプレビュー・自動保存・毎日の記録つき。はじめての一作にも。",
            "image": "https://cotonoha-leaf.org/lp/ogp.png",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "JPY" },

  <body>
    <div id="root"></div>
    <!-- JS が動かない閲覧者・クローラー向けの説明。#root の外に置く（中に置くと、下の起動失敗の
         受けが「何か描かれている」と誤認する）。JS が動く環境では表示されない。 -->
    <noscript>
      <div style="max-width:720px;margin:0 auto;padding:48px 20px;font-family:system-ui,sans-serif;line-height:1.9;color:#1f2430">
        <h1 style="font-size:24px;margin:0 0 12px">コトノハ-leaf- — 無料の縦書き小説エディタ</h1>
        <p style="margin:0 0 12px">登録もインストールも不要。ブラウザで開いてすぐ書き始められる、無料の縦書き小説エディタです。縦書きプレビュー、ルビと傍点、用語集、プロット、自動保存、「小説家になろう」「カクヨム」・EPUB への書き出しまでそろっています。有料のクラウド版では、MCP で Claude や ChatGPT から作品を読み書きできます。</p>
        <p style="margin:0 0 12px">このアプリは JavaScript を使って動きます。有効にしてから、もう一度開いてください。</p>
        <ul style="margin:0;padding-left:1.2em">
          <li><a href="/lp/">できること・料金・よくある質問</a></li>
          <li><a href="/lp/ai/">AI 連携（MCP）：Claude・ChatGPT で原稿を読み書き</a></li>
        </ul>
      </div>
    </noscript>
    <script type="module" src="/src/ui/main.tsx"></script>
    <!--
      アプリの JS 自体が届かなかった場合の受け。React が起動していないので、
      アプリ内のエラー境界では拾えず、放っておくと白い画面のまま何も起きない
      （LP から来た初回＝cold load で電波が切れると踏む）。
      取得失敗だけを拾い、セッション中 1 回だけ自動で取り直す。二度目は案内を出す。

      拾うのは「起動前」の失敗だけに限る（window.__nsBooted）。main.tsx が動き出した後は
      React のエラー境界の担当で、ここで拾ってはいけない。起動後に遅れて失敗した動的
      チャンクまで「起動失敗」と見なすと、main.tsx が毎回リトライ記録を消すため
      1 回だけのはずの再読み込みが無限に繰り返される（本番で実際に踏んだ）。
    -->
    <script>
      (function () {
        var KEY = 'ns-boot-retry'
        addEventListener(
          'error',
          function (e) {
            if (window.__nsBooted) return
            var el = e.target
            if (!el || el.tagName !== 'SCRIPT' || el.type !== 'module') return
            try {
              if (!sessionStorage.getItem(KEY)) {
                sessionStorage.setItem(KEY, '1')
                location.reload()
                return
              }
            } catch (_) {}
            var root = document.getElementById('root')
            if (root && !root.firstChild) {
              root.innerHTML =
                '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:system-ui,sans-serif;color:#1f2430">' +
                '<p style="margin:0">画面を読み込めませんでした。</p>' +
                '<p style="margin:0;font-size:14px;color:#6b7381">通信が途切れた可能性があります。書いた原稿はこの端末に保存されています。</p>' +
                '<button type="button" style="border:0;border-radius:999px;background:#2c5b27;color:#fff;padding:10px 20px;font-size:14px" onclick="location.reload()">再読み込み</button>' +
                '</div>'
            }
          },
          true,
        )
        // 記録を落とすのは「起動できた時」だけ（main.tsx が消す）。ページの load で
        // 消すと、失敗したまま load が走って自動再読み込みが繰り返しになる。
      })()
    </script>
    <!-- 訪問者カウント（Cookie なし・自前集計）。?noanalytics=1 で自分の端末を除外できる。 -->
    <script src="/hit.js" defer></script>
  </body>
</html>
