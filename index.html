<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>コトノハ-leaf- — 小説、書いてみよう。</title>
    <meta
      name="description"
      content="登録もインストールも不要。ブラウザで開いてすぐ書き始められる、無料の縦書き小説エディタ。縦書きプレビュー・自動保存・毎日の記録つき。はじめての一作にも。"
    />
    <meta name="theme-color" content="#2c5b27" />
    <link rel="icon" href="/favicon-clean.png" type="image/png" sizes="any" />
    <!-- 正規URLは本番ドメインに固定（プレビュー配信の重複インデックスを防ぐ）。 -->
    <link rel="canonical" href="https://cotonoha-leaf.org/" />

    <!-- 表示設定の先読み（描画前にテーマ・本文サイズを反映してちらつきを防ぐ）。
         キー/値は src/ui/hooks/use-preferences.ts と一致させること。 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ns-theme') || 'system'
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var s = localStorage.getItem('ns-reading-size')
          var px = s === 'small' ? '13.5px' : s === 'large' ? '17px' : ''
          if (px) document.documentElement.style.setProperty('--reading-font-size', px)
        } catch (e) {}
      })()
    </script>

    <!-- OGP（SNS 共有時のカード。画像は LP と共通） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="コトノハ-leaf-" />

    />

    />
