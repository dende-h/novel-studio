<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 旧ハッシュURL（/#/terms 等）を静的HTMLの実URLへ寄せる。# 以降はサーバへ届かず _redirects では
         処理できないため、ここ（最速の同期スクリプト）でクライアント側リダイレクトする。 -->
    <script>
      (function () {
        var map = { '#/terms': '/terms', '#/privacy': '/privacy', '#/tokushoho': '/tokushoho' }
        var to = map[location.hash]
        if (to) location.replace(to)
      })()
    </script>
    <title>コトノハ-leaf- — 小説、書いてみよう。</title>
    <meta
      name="description"
      content="登録もインストールも不要。ブラウザで開いてすぐ書き始められる、無料の縦書き小説エディタ。縦書きプレビュー・自動保存・毎日の記録つき。はじめての一作にも。"
    />
    <meta name="theme-color" content="#2c5b27" />
    <link rel="icon" href="/favicon-clean.png" type="image/png" sizes="any" />
    <!-- 正規URLは本番ドメインに固定（プレビュー配信の重複インデックスを防ぐ）。 -->
    <link rel="canonical" href="https://cotonoha-leaf.org/" />

    <!-- 表示設定の先読み（描画前にテーマ・本文サイズを反映してちらつきを防ぐ）。
         キー/値は src/ui/hooks/use-preferences.ts と一致させること。 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ns-theme') || 'system'
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
          var s = localStorage.getItem('ns-reading-size')
          var px = s === 'small' ? '13.5px' : s === 'large' ? '17px' : ''
          if (px) document.documentElement.style.setProperty('--reading-font-size', px)
        } catch (e) {}
      })()
    </script>

    <!-- OGP（SNS 共有時のカード。画像は LP と共通） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="コトノハ-leaf-" />
    <meta property="og:title" content="コトノハ-leaf- — 小説、書いてみよう。" />
    <meta
      property="og:description"
      content="登録もインストールも不要。ブラウザで開いてすぐ書き始められる、無料の縦書き小説エディタ。縦書きプレビュー・自動保存・毎日の記録つき。"
    />
    <meta property="og:url" content="https://cotonoha-leaf.org/" />
    <meta property="og:image" content="https://cotonoha-leaf.org/lp/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="コトノハ-leaf- — 小説、書いてみよう。" />
    <meta
      name="twitter:description"
      content="登録もインストールも不要。ブラウザで開いてすぐ書き始められる無料の縦書き小説エディタ。縦書きプレビュー・自動保存・毎日の記録つき。"
    />
    <meta name="twitter:image" content="https://cotonoha-leaf.org/lp/ogp.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
    <!--
      アプリの JS 自体が届かなかった場合の受け。React が起動していないので、
      アプリ内のエラー境界では拾えず、放っておくと白い画面のまま何も起きない
      （LP から来た初回＝cold load で電波が切れると踏む）。
      取得失敗だけを拾い、セッション中 1 回だけ自動で取り直す。二度目は案内を出す。

      拾うのは「起動前」の失敗だけに限る（window.__nsBooted）。main.tsx が動き出した後は
      React のエラー境界の担当で、ここで拾ってはいけない。起動後に遅れて失敗した動的
      チャンクまで「起動失敗」と見なすと、main.tsx が毎回リトライ記録を消すため
      1 回だけのはずの再読み込みが無限に繰り返される（本番で実際に踏んだ）。
    -->
    <script>
      (function () {
        var KEY = 'ns-boot-retry'
        addEventListener(
          'error',
          function (e) {
            if (window.__nsBooted) return
            var el = e.target
            if (!el || el.tagName !== 'SCRIPT' || el.type !== 'module') return
            try {
              if (!sessionStorage.getItem(KEY)) {
                sessionStorage.setItem(KEY, '1')
                location.reload()
                return
              }
            } catch (_) {}
            var root = document.getElementById('root')
            if (root && !root.firstChild) {
              root.innerHTML =
                '<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:system-ui,sans-serif;color:#1f2430">' +
                '<p style="margin:0">画面を読み込めませんでした。</p>' +
                '<p style="margin:0;font-size:14px;color:#6b7381">通信が途切れた可能性があります。書いた原稿はこの端末に保存されています。</p>' +
                '<button type="button" style="border:0;border-radius:999px;background:#2c5b27;color:#fff;padding:10px 20px;font-size:14px" onclick="location.reload()">再読み込み</button>' +
                '</div>'
            }
          },
          true,
        )
        // 記録を落とすのは「起動できた時」だけ（main.tsx が消す）。ページの load で
        // 消すと、失敗したまま load が走って自動再読み込みが繰り返しになる。
      })()
    </script>
  </body>
</html>
