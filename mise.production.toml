# MISE_ENV=production のとき mise.toml に上書き適用される（main ブランチ用）。
[env]
VITE_APP_ENV = "production"
# Clerk publishable key（公開可）。本番 production インスタンス（clerk.cotonoha-leaf.org）の pk_live_。
# VITE_ はビルド時に焼き込まれる＝Cloudflare Pages の env では効かず、ここに書く必要がある。
# 未設定だとゲスト＝完全ローカル動作（認証 UI は出ない）。手順は docs/requirement/05-sync-setup.md。
VITE_CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsuY290b25vaGEtbGVhZi5vcmck"

# 直接投稿の送信先（novel platform）。本番URLが決まったら設定する。
# 空のあいだは投稿UIを出さない。
VITE_PLATFORM_ORIGIN = ""
