# Cloudflare Pages（Functions＋バインディング）の設定。
# 既存の GitHub Actions デプロイ（wrangler pages deploy dist）はこの設定を自動で読む。
# セットアップ手順は docs/requirement/05-sync-setup.md を参照。
name = "novel-studio"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"
# @clerk/backend は Node 互換 API を使うため nodejs_compat を付ける。
compatibility_flags = ["nodejs_compat"]

# --- バインディング ---------------------------------------------------------
# `wrangler d1 create novel-studio`（2026-06-22 作成・APAC）の database_id。
# binding 名は Functions 側（functions/api/session/* の Env.DB）に合わせて DB。
[[d1_databases]]
binding = "DB"
database_name = "novel-studio"
database_id = "811bad99-8040-4c46-9192-26623aeabc99"

# 同期本体（Phase 2）の暗号化ブロブ置き場。`wrangler r2 bucket create novel-studio-media` 後に有効。
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "novel-studio-media"

# --- プレビュー（stg ブランチ）専用バインディング -----------------------------
# トップレベルは local＋本番(production)に適用される。stg は本番ブランチ(main)と
# 一致しないため Pages が自動で preview 環境として扱い、ここで D1・R2 を上書きする
# → 本番ユーザーデータと stg テストデータを物理的に分離する。
# 注意: D1・R2 は non-inheritable キー。preview を上書きするなら preview に「両方」必須
#       （片方だけだとデプロイ検証に落ちる）。
[[env.preview.d1_databases]]
binding = "DB"
database_name = "novel-studio-stg"
database_id = "b41dafd3-26fb-4e2e-823a-031a3398d4f5"

[[env.preview.r2_buckets]]
binding = "MEDIA"
bucket_name = "novel-studio-media-stg"

# --- MCP OAuth コネクタ（結線時に設定・未設定でも従来 mcp_ トークンは動く）-------
# Clerk を認可サーバーにするための公開値。Pages の環境変数（本番/preview）に設定する。
# シークレットではないので [vars] でも可。値は Clerk ダッシュボードの OAuth 設定確定後に投入。
#   MCP_OAUTH_ISSUER   = Clerk の issuer URL（.well-known/oauth-authorization-server のホスト）
#   MCP_OAUTH_AUDIENCE = このリソースの正準 URI（例: https://<本番ホスト>/api/mcp）
#   MCP_OAUTH_SCOPES   = 対応スコープ（スペース区切り・任意）
# 詳細な段取りは memory: mcp-oauth-connector-plan を参照。

# --- Stripe 直課金（JPY）------------------------------------------------------
# Clerk Billing（USD 固定）を廃し、認証は Clerk・決済は Stripe 直課金に移行。
# 会員判定の真実は D1 subscriptions（Stripe webhook が更新）。値はダッシュボード等で設定する。
# シークレット（.dev.vars ＋ `wrangler pages secret put`・本番/preview 両方）:
#   STRIPE_SECRET_KEY     = Stripe シークレットキー（sk_live_ / sk_test_）
#   STRIPE_WEBHOOK_SECRET = /api/webhooks/stripe の署名シークレット（whsec_）
#   REAP_SECRET           = /api/billing/reap を叩く共有シークレット（GitHub Secrets にも設定）
# 非シークレット（Pages env・環境別／test と live で price ID が異なる）:
#   STRIPE_PRICE_MONTHLY  = 月額 ¥500 の price ID
#   STRIPE_PRICE_YEARLY   = 年額 ¥4,800 の price ID
