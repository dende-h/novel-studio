name = "novel-studio-narration-stg"
main = "worker.ts"
compatibility_date = "2026-11-01"
[vars]
API_ORIGIN = "https://stg.novel-studio-b2m.pages.dev"
[[d1_databases]]
binding = "DB"
database_name = "novel-studio-stg"
database_id = "b41dafd3-26fb-4e2e-823a-031a3398d4f5"
[[durable_objects.bindings]]
name = "RUNNER"
class_name = "NarrationRunner"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["NarrationRunner"]

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "novel-studio-media-stg"
[triggers]
crons = ["17 * * * *"]
